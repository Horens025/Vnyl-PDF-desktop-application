<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Vnyl</title>
    <!--
      The same mark the desktop icon set is generated from, so the browser tab,
      the app window `run.py dev` opens, and the installed app all show one
      logo. Referenced out of src/assets rather than copied into public/: Vite
      rewrites and hashes link hrefs in this file, and a second copy of the
      artwork would be a copy nobody remembers to update.
    -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/vnyl-logo.svg" />
    <!--
      No-flash theme bootstrap: apply the saved (or system) theme before first
      paint so the app never flashes the wrong background. Kept tiny and inline
      on purpose. ThemeProvider takes over once React mounts.
    -->
    <script>
      (function () {
        try {
          // Carry settings and document annotations forward from pre-rebrand
          // installs without keeping the old storage namespace in active use.
          Object.keys(localStorage).forEach(function (key) {
            if (!key.startsWith('folio.') && !key.startsWith('folio:')) return;
            var nextKey = key.replace(/^folio(?=[.:])/, 'vnyl');
            if (localStorage.getItem(nextKey) === null) {
              localStorage.setItem(nextKey, localStorage.getItem(key));
            }
          });
          var stored = localStorage.getItem('vnyl.theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored === 'system' && prefersDark);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.setAttribute(
            'data-style',
            localStorage.getItem('vnyl.style') === 'classic' ? 'classic' : 'glass',
          );
          document.documentElement.setAttribute(
            'data-glass',
            localStorage.getItem('vnyl.glass') === 'clear' ? 'clear' : 'frosted',
          );
        } catch (e) {
          /* localStorage may be unavailable; default styling still applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
