[package]
name = "vnyl-core"
version = "0.9.0"
edition = "2021"
license = "MIT"
description = "Vnyl PDFium + security native core for Kotlin/Skiko desktop UI"

[lib]
name = "vnyl_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jni = "0.21"
pdfium-render = { version = "0.8", features = ["image_025"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
once_cell = "1"
tempfile = "3"
ureq = "3"
url = "2"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
rfd = { version = "0.15", default-features = false }
cms = { version = "0.2.3", features = ["builder"] }
p12-keystore = "0.2.0"
x509-cert = "0.2.5"
der = "0.7.9"
rsa = { version = "0.9.6", features = ["sha2"] }
pkcs8 = "0.10.2"
sha2 = { version = "0.10.8", features = ["oid"] }
const-oid = "0.9.6"
base64 = "0.22"
hex = "0.4"
keyring = { version = "=3.6.3", features = [
  "apple-native",
  "windows-native",
  "linux-native-sync-persistent",
  "crypto-rust",
] }
